<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 / 注册 · OCplay</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="deco-bg"></div>

<nav class="navbar">
  <div class="nav-logo"><span class="logo-icon">🎨</span><span class="logo-text">OCplay</span></div>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="events.html">展会活动</a>
    <a href="oc-gallery.html">OC作品广场</a>
    <a href="booth-apply.html">申摊报名</a>
    <a href="profile.html">个人中心</a>
  </div>
  <div class="nav-actions">
    <a href="auth.html" class="btn btn-primary btn-sm">登录 / 注册</a>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="deco">🎨</div>
    <h2>欢迎来到 OCplay</h2>
    <div class="sub">OC原创角色展会综合服务平台</div>

    <!-- Tab切换 登录/注册/找回 -->
    <div class="auth-tabs" data-tabs data-target="#authPanels">
      <button class="active" data-tab="login">登录</button>
      <button data-tab="register">注册</button>
      <button data-tab="reset">找回密码</button>
    </div>

    <div id="authPanels">
      <!-- 登录 -->
      <div data-panel="login">
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input class="form-input" placeholder="请输入手机号">
        </div>
        <div class="form-group">
          <label class="form-label">验证码</label>
          <div class="input-wrap">
            <input class="form-input" placeholder="请输入短信验证码" style="padding-right:100px">
            <button class="code-btn">获取验证码</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">密码（可选，验证码登录可不填）</label>
          <input class="form-input" type="password" placeholder="设置过密码可直接密码登录">
        </div>
        <button class="btn btn-primary btn-block btn-lg" onclick="location.href='profile.html'">登录</button>
        <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text-muted)">
          登录即表示同意 <a href="#" style="color:var(--coral)">《用户协议》</a> 与 <a href="#" style="color:var(--coral)">《隐私政策》</a>
        </div>
      </div>

      <!-- 注册 -->
      <div data-panel="register" style="display:none">
        <div class="form-group">
          <label class="form-label">手机号 <span class="req">*</span></label>
          <input class="form-input" placeholder="请输入手机号">
        </div>
        <div class="form-group">
          <label class="form-label">短信验证码 <span class="req">*</span></label>
          <div class="input-wrap">
            <input class="form-input" placeholder="请输入验证码" style="padding-right:100px">
            <button class="code-btn">获取验证码</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">设置密码 <span class="req">*</span></label>
          <input class="form-input" type="password" placeholder="6-20位，字母+数字组合">
          <div class="form-hint">建议设置强密码，保障账号安全</div>
        </div>
        <div class="form-group">
          <label class="form-label">昵称 <span class="req">*</span></label>
          <input class="form-input" placeholder="给自己取一个好听的昵称">
        </div>
        <div class="declare-box">
          <label>
            <input type="checkbox" checked>
            <div class="text"><strong>我已阅读并同意</strong>《用户协议》《隐私政策》《OC原创内容规范》</div>
          </label>
        </div>
        <button class="btn btn-primary btn-block btn-lg" onclick="location.href='profile.html'">注册并登录</button>
      </div>

      <!-- 找回密码 -->
      <div data-panel="reset" style="display:none">
        <div class="form-group">
          <label class="form-label">注册手机号 <span class="req">*</span></label>
          <input class="form-input" placeholder="请输入注册时的手机号">
        </div>
        <div class="form-group">
          <label class="form-label">短信验证码 <span class="req">*</span></label>
          <div class="input-wrap">
            <input class="form-input" placeholder="请输入验证码" style="padding-right:100px">
            <button class="code-btn">获取验证码</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">设置新密码 <span class="req">*</span></label>
          <input class="form-input" type="password" placeholder="设置新密码">
        </div>
        <div class="form-group">
          <label class="form-label">确认新密码 <span class="req">*</span></label>
          <input class="form-input" type="password" placeholder="再次输入新密码">
        </div>
        <button class="btn btn-primary btn-block btn-lg">重置密码</button>
      </div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container"><div class="footer-bottom">© 2026 OCplay · OC原创角色展会综合服务平台</div></div>
</footer>
<script src="js/main.js"></script>
</body>
</html>
